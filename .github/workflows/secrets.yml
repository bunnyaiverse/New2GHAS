name: Secret Scanning Demo

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  gitleaks:
    name: Gitleaks scan
    runs-on: [self-hosted, Windows]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate local dashboard reports
        if: always()
        shell: pwsh
        run: .\scripts\run-local-scans.ps1

      - name: Upload dashboard reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secret-training-reports
          path: reports/
