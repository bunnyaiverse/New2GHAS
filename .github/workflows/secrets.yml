name: Secret Scanning Demo

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  gitleaks:
    name: Gitleaks scan
    runs-on: [self-hosted, Windows]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Gitleaks on Windows
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $version = "8.24.3"
          $zipUrl = "https://github.com/gitleaks/gitleaks/releases/download/v$version/gitleaks_$version`_windows_x64.zip"
          $zipPath = "$env:RUNNER_TEMP\gitleaks.zip"
          $installDir = "$env:RUNNER_TEMP\gitleaks"

          New-Item -ItemType Directory -Force -Path $installDir | Out-Null

          Invoke-WebRequest -Uri $zipUrl -OutFile $zipPath
          Expand-Archive -Path $zipPath -DestinationPath $installDir -Force

          echo "$installDir" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

          & "$installDir\gitleaks.exe" version

      - name: Run Gitleaks
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path reports | Out-Null

          gitleaks detect `
            --source . `
            --report-format json `
            --report-path reports\gitleaks-report.json `
            --redact

      - name: Generate local dashboard reports
        if: always()
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File .\scripts\run-local-scans.ps1

      - name: Upload dashboard reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: secret-training-reports
          path: reports/
