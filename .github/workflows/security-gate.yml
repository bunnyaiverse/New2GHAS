name: Security Quality Gate

on:
  workflow_run:
    workflows: ["CodeQL SAST", "Secret Scanning Demo"]
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-gate:
    name: Evaluate security policy
    runs-on: [self-hosted, Windows]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Python 3.11
        shell: powershell
        run: |
          py -3.11 --version

      - name: Generate reports if missing
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File .\scripts\run-local-scans.ps1

      - name: Evaluate quality gate
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File .\scripts\evaluate-security-gate.ps1

      - name: Upload quality gate reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-quality-gate-reports
          path: reports/
