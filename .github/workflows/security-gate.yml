name: Security Quality Gate

on:
  workflow_run:
    workflows: ["CodeQL SAST", "Secret Scanning Demo"]
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-gate:
    name: Evaluate security policy
    runs-on: [self-hosted, Windows]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install parser dependencies
        shell: pwsh
        run: python -m pip install PyYAML==6.0.2

      - name: Generate reports if missing
        shell: pwsh
        run: .\scripts\run-local-scans.ps1

      - name: Evaluate quality gate
        shell: pwsh
        run: .\scripts\evaluate-security-gate.ps1

      - name: Upload quality gate reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-quality-gate-reports
          path: reports/
