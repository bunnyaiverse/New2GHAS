name: CodeQL SAST

"on":
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: CodeQL analyze Python
    runs-on:
      - self-hosted
      - Windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python
          config-file: ./.github/codeql/codeql-config.yml

      - name: Verify Python
        shell: powershell
        run: py -3.11 --version

      - name: Install dependencies
        shell: powershell
        run: |
          py -3.11 -m pip install --upgrade pip
          py -3.11 -m pip install -r requirements.txt

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

      - name: Generate local dashboard reports
        if: always()
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File .\scripts\run-local-scans.ps1

      - name: Upload dashboard reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ghas-training-reports
          path: reports/
